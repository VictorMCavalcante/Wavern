name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-dmg:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      # Optional: with these set the app is Developer ID signed and notarized; without, ad-hoc.
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}            # base64 of the exported .p12
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}                  # App Store Connect API key (.p8 contents)
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      # Required: Sparkle EdDSA private key (generate_keys -x). Updates are refused without a valid signature.
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release)
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          xcodebuild \
            -project Wavern.xcodeproj \
            -scheme Wavern \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            build

      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPASS="$(uuidgen)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          test -n "$ID"
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"

      - name: Code sign
        run: |
          APP="build/Build/Products/Release/Wavern.app"
          if [ -n "${SIGN_ID:-}" ]; then
            # Inside-out, hardened runtime; Sparkle's helpers per its distribution docs.
            S=(codesign --force --timestamp --options runtime --sign "$SIGN_ID")
            FW="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
            "${S[@]}" "$FW/XPCServices/Installer.xpc"
            "${S[@]}" --preserve-metadata=entitlements "$FW/XPCServices/Downloader.xpc"
            "${S[@]}" "$FW/Autoupdate"
            "${S[@]}" "$FW/Updater.app"
            "${S[@]}" "$APP/Contents/Frameworks/Sparkle.framework"
            "${S[@]}" "$APP/Contents/MacOS/WavernBrowserBridge"
            "${S[@]}" --entitlements Sources/Wavern/Wavern.entitlements "$APP"
          else
            # Ad-hoc, no hardened runtime: library validation would reject Sparkle without a Team ID.
            codesign --force --deep --sign - --entitlements Sources/Wavern/Wavern.entitlements "$APP"
          fi
          codesign --verify --deep --strict "$APP"

      - name: Package .dmg
        run: |
          APP="build/Build/Products/Release/Wavern.app"
          STAGE="$(mktemp -d)/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="Wavern-${TAG}-macos.dmg"
          hdiutil create -volname "Wavern" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          if [ -n "${SIGN_ID:-}" ]; then codesign --force --timestamp --sign "$SIGN_ID" "$DMG"; fi
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize
        if: env.SIGN_ID != '' && env.NOTARY_KEY_P8 != ''
        run: |
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$DMG"

      - name: Sign update and write appcast
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY"
          SIGN_UPDATE="build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          SIG=$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "$DMG")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DMG}"
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Wavern</title>
              <item>
                <title>Wavern ${VERSION}</title>
                <link>https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}</link>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.4</sparkle:minimumSystemVersion>
                <pubDate>$(LC_ALL=C date -R)</pubDate>
                <enclosure url="${URL}" ${SIG} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF

      - name: Attach .dmg and appcast to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$DMG" appcast.xml --clobber

      - name: Clean up keychain
        if: always() && env.SIGN_ID != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
